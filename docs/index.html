<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkNext</title>
<meta name="description" content="Rent a parking space by the hour, or earn from the one you already have.">
<link rel="icon" href="/icon.png">
<style>
  :root {
    --amber: #FBB112;
    --graphite: #39424F;
    --ink: #1B1F27;
    --ink-soft: #4A515E;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--amber);
    color: var(--graphite);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
  }
  img.wordmark {
    width: min(72vw, 340px);
    height: auto;
    display: block;
  }
  p.tagline {
    margin: 28px 0 0;
    font-size: 18px;
    max-width: 30ch;
    color: var(--graphite);
  }
  p.status {
    margin: 10px 0 0;
    font-size: 15px;
    opacity: 0.72;
  }
  footer {
    padding: 24px;
    text-align: center;
    font-size: 14px;
  }
  footer a {
    color: var(--graphite);
    text-decoration: underline;
    text-underline-offset: 3px;
    margin: 0 10px;
    display: inline-block;
  }
  footer a:hover { color: var(--ink); }
</style>
</head>
<body>

<main>
  <img class="wordmark" src="/logo-wordmark.png" alt="ParkNext">
  <p class="tagline">Rent a parking space by the hour, or earn from the one you already have.</p>
  <p class="status">Coming to Android.</p>
</main>

<footer>
  <a href="/privacy">Privacy Policy</a>
  <a href="/delete-account">Delete your account</a>
  <a href="mailto:support@park-next.in">support@park-next.in</a>
</footer>

</body>
</html>
